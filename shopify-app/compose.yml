services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: seo
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    volumes: ["redis_data:/data"]
  migrate:
    build: .
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { HOST: "0.0.0.0", PORT: "3000" }
    secrets:
      - source: google-adc
        target: google-adc.json
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["npm", "run", "worker:production"]
    secrets:
      - source: google-adc
        target: google-adc.json
    shm_size: 1gb
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    depends_on: [web]
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
secrets:
  google-adc:
    file: ./secrets/google-adc.json
